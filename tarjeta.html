<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta Baby Shower de Daziel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap">
<style>
  /* Tarjeta vertical 1080x1920 para WhatsApp. Exportada a tarjeta.png */
  :root{--sky:#fbd3df;--sky-deep:#f4a9c0;--petal:#ff8fb1;--blossom:#e5487a;--plum:#3d1b38;--cream:#fff6f0;--gold:#f6b93b;--font-display:"Press Start 2P","Courier New",monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:#888}
  .card{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--plum);font-family:var(--font-display);
    background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky) 38%,var(--cream) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 80px 80px;gap:26px}
  .hud{width:100%;display:flex;justify-content:space-between;font-size:26px;line-height:1.6;text-transform:uppercase}
  .life{color:var(--blossom);letter-spacing:6px}
  .flower{width:190px;height:190px}
  .ed{font-size:28px;color:var(--blossom);letter-spacing:3px}
  .title{margin:0;text-align:center;text-transform:uppercase;font-weight:normal;font-size:112px;line-height:1.2;color:var(--cream);
    text-shadow:8px 0 var(--plum),-8px 0 var(--plum),0 8px var(--plum),0 -8px var(--plum),8px 8px var(--plum),-8px -8px var(--plum),8px -8px var(--plum),-8px 8px var(--plum),16px 16px 0 var(--blossom)}
  .para{font-size:30px;background:var(--plum);color:var(--gold);padding:14px 28px}
  .name{font-size:92px;margin:0;font-weight:normal;color:var(--cream);text-transform:uppercase;
    text-shadow:8px 0 var(--plum),-8px 0 var(--plum),0 8px var(--plum),0 -8px var(--plum),8px 8px var(--plum),-8px -8px var(--plum),8px -8px var(--plum),-8px 8px var(--plum),16px 16px 0 var(--blossom)}
  .dialog{width:100%;background:var(--plum);color:var(--cream);border:10px solid var(--cream);outline:10px solid var(--plum);box-shadow:0 0 0 22px var(--petal);
    padding:30px 36px 40px;font-size:30px;line-height:1.9;position:relative;margin:0 22px}
  .dialog em{font-style:normal;color:var(--gold)}
  .dialog .more{position:absolute;right:28px;bottom:12px;color:var(--petal);font-size:30px}
  .info{width:100%;display:flex;gap:36px;align-items:stretch}
  .box{background:var(--cream);border:10px solid var(--plum);box-shadow:14px 14px 0 var(--blossom);padding:30px}
  .data{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;font-size:26px;line-height:1.5}
  .data b{display:block;font-weight:normal;font-size:22px;color:var(--blossom);margin-bottom:6px}
  .qr{width:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;font-size:20px;line-height:1.6}
  .qr svg{width:100%;height:auto;display:block}
  .petal{position:absolute;opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="hud"><span>Jugador 1 · Invitado</span><span class="life">♥♥♥</span><span>Nv. 1</span></div>

    <use href="#p"/><use href="#p" transform="rotate(72)"/><use href="#p" transform="rotate(144)"/><use href="#p" transform="rotate(216)"/><use href="#p" transform="rotate(288)"/>

<span>ESCANEA<br>PARA LLEGAR</span></div>
